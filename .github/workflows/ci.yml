name: qemu-tool-action - CI

# Also on a schedule and on push to main: the default qemu-tool version is a
# range and the guest image it pulls moves, so the action can break with no
# commit here.
on:
  workflow_dispatch:
    inputs:
      two-guests:
        description: Also boot two guests and run RDMA between them
        type: boolean
        default: false
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  schedule:
    - cron: '17 5 * * 1,4'

permissions:
  contents: read

# Only a pull request's runs replace one another. Runs on main, the
# scheduled one included, each get a group of their own, so none is dropped
# from the queue by the next.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:

  lint:
    name: Lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Syntax
        run: |
          python3 -m py_compile qemu_tool_action.py
          for f in launch.js main.js post.js; do node --check "$f"; done
          shellcheck tests/*.sh scripts/*.sh

      # Checks every `with:` key of the `uses: ./` steps below against
      # action.yml, as well as the workflows themselves.
      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:latest -color

      - name: Unit tests
        run: python3 -m unittest discover -s tests -v

      - name: Entry point, without a runner
        run: tests/smoke.sh

      - name: Release logic, without a release
        run: tests/test_release.sh

  operations:
    name: install and command
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Note the runner's python3
        run: echo "PY_BEFORE=$(command -v python3)" >> "$GITHUB_ENV"

      - name: install
        id: install
        uses: ./
        with:
          operation: install

      - name: Only qemu-tool and oras were added to PATH
        env:
          TOOL: ${{ steps.install.outputs.qemu-tool-path }}
          VERSION: ${{ steps.install.outputs.qemu-tool-version }}
        run: |
          set -eu
          [ "$(command -v qemu-tool)" = "$TOOL" ]
          qemu-tool --version | grep -F "$VERSION"
          [ "$(command -v python3)" = "$PY_BEFORE" ]
          oras version
          qemu-tool check || echo "::warning::qemu-tool check reported a failure"

      - name: command
        uses: ./
        with:
          operation: command
          args: run-vm --vm-name ci-test --dry-run --no-kvm

      - name: A v1 operation is refused
        id: v1
        continue-on-error: true
        uses: ./
        with:
          operation: gen-vm

      - name: It was refused
        env:
          OUTCOME: ${{ steps.v1.outcome }}
        run: '[ "$OUTCOME" = failure ]'

  # No guest: this is the root, no-sudo, no-docker path of install and of
  # host setup, in an image the action knows nothing about.
  container:
    name: install and command, in a container job
    runs-on: ubuntu-latest
    container:
      image: python:3.12-slim
      options: >-
        -v /var/lib/qemu-tool:/var/lib/qemu-tool
    steps:
      - uses: actions/checkout@v7

      - name: Note the image's python3
        run: echo "PY_BEFORE=$(command -v python3)" >> "$GITHUB_ENV"

      - name: install
        id: install
        uses: ./
        with:
          operation: install

      - name: Installed under the shared mount, python3 untouched
        env:
          TOOL: ${{ steps.install.outputs.qemu-tool-path }}
        run: |
          set -eu
          [ "$(command -v qemu-tool)" = "$TOOL" ]
          case "$TOOL" in
            /var/lib/qemu-tool/*) ;;
            *) echo "::error::installed outside the shared mount: $TOOL"; exit 1 ;;
          esac
          [ "$(command -v python3)" = "$PY_BEFORE" ]
          qemu-tool --version
          oras version
          for t in qemu-img zstd ssh git ansible-playbook; do
            command -v "$t"
          done

      - name: command
        uses: ./
        with:
          operation: command
          args: run-vm --vm-name ci-test --dry-run --no-kvm

  # A release pinned by tag: what `qemu-tool-ref` is for. No guest.
  ref:
    name: install from a tag of qemu-minimal
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: install
        id: install
        uses: ./
        with:
          operation: install
          qemu-tool-ref: v2.1.0

      - name: The tag, its commit, and a checkout to read
        env:
          VERSION: ${{ steps.install.outputs.qemu-tool-version }}
          SHA: ${{ steps.install.outputs.qemu-tool-sha }}
          CHECKOUT: ${{ steps.install.outputs.qemu-tool-checkout }}
        run: |
          set -eu
          [ "$VERSION" = 2.1.0 ]
          [ "${#SHA}" = 40 ]
          [ "$(git -C "$CHECKOUT" rev-parse HEAD)" = "$SHA" ]
          test -f "$CHECKOUT/qemu/stacks/rocm-golden.xml"
          qemu-tool --version

      - name: A second way to say which qemu-tool is refused
        id: both
        continue-on-error: true
        uses: ./
        with:
          operation: install
          qemu-tool-ref: v2.1.0
          qemu-tool-version: 2.1.0

      - name: It was refused
        env:
          OUTCOME: ${{ steps.both.outcome }}
        run: '[ "$OUTCOME" = failure ]'

  # qemu-tool's unreleased main. Not on pull requests, so that a break
  # upstream is seen here without blocking a change that did not cause it.
  # smoke.sh renders every fleet main ships, the action's way, and reads
  # the inventories back: that is what a fleet XML change breaks first.
  upstream-main:
    name: Against qemu-minimal main
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: install
        id: install
        uses: ./
        with:
          operation: install
          qemu-tool-ref: main

      - name: Every fleet main ships renders, and the containers get main
        env:
          CHECKOUT: ${{ steps.install.outputs.qemu-tool-checkout }}
        run: tests/smoke.sh "$CHECKOUT/qemu"

      - name: The flags `up` passes still exist
        run: |
          set -eu
          help=$(qemu-tool quick-start --help)
          for f in --flavor --xml --stack-dir --key-dir --images --yes \
                   --no-metrics --no-size-from-host --in-network --clean-overlays; do
            printf '%s\n' "$help" | grep -q -- "$f" \
              || { echo "::error::quick-start lost $f"; exit 1; }
          done

  boot:
    name: Boot one guest
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      # One guest: four vCPUs is the RDMA driver's floor and a hosted runner
      # has four cores. Cut down by an overlay file, which is how a caller
      # with a fleet change of their own would do it.
      - name: up
        id: fleet
        uses: ./
        with:
          xml-overlay: examples/overlay-one-guest.xml
          wait-for: rdma
          copy: |
            tests:action-tests
          fetch: |
            results
          run: |
            set -x
            test -f smoke.sh
            [ "$QT_VM_INDEX" = 1 ]
            [ "$QT_VM_COUNT" = 1 ]
            nproc
            lspci -nn | grep 1dd8:1002
            ibv_devinfo -d "$QT_RDMA_DEVICE" | grep PORT_ACTIVE
            # The GPU, bound: a named node in the KFD topology.
            test -e /dev/kfd
            cat /sys/class/kfd/kfd/topology/nodes/*/name | grep .
            mkdir -p ~/results
            lspci -nn > ~/results/lspci.txt

      - name: The outputs describe the guest
        env:
          MANIFEST: ${{ steps.fleet.outputs.vm-manifest }}
          COUNT: ${{ steps.fleet.outputs.vm-count }}
          NAMES: ${{ steps.fleet.outputs.vm-names }}
          FETCHED: ${{ steps.fleet.outputs.fetch-dir }}
        run: |
          set -eu
          echo "$MANIFEST" | python3 -c '
          import json, sys
          m = json.load(sys.stdin)
          assert len(m) == 1 and m[0]["rdma_device"], m
          assert m[0]["gpu"] == "loaded", m
          print(m[0]["ssh_cmd"])'
          [ "$COUNT" = 1 ]
          grep -q 1dd8 "$FETCHED/$NAMES/results/lspci.txt"
          ssh -F "$QEMU_TOOL_SSH_CONFIG" vm1 uname -r
          [ "$NAMES" = ci-1 ]
          qemu-tool ssh "$NAMES" -- true
          qemu-tool compose ps

      # The qemu-tool inside the stack's containers is the runner's, built
      # from the tree the action placed, not a release pulled from PyPI.
      - name: The containers run the runner's qemu-tool
        run: |
          set -eu
          inside=$(docker exec ci-qemu-1-1 /tmp/qemu-tool-venv/bin/qemu-tool --version)
          echo "runner: $(qemu-tool --version); container: $inside"
          [ "$inside" = "$(qemu-tool --version)" ]
          docker exec ci-qemu-1-1 test -d /qemu-tool-src/qemu/qemu_tool

      - name: exec
        uses: ./
        with:
          operation: exec
          run-on: first
          env: |
            GREETING=hello there
          run: |
            [ "$GREETING" = "hello there" ]
            pwd | grep -q action-tests

      - name: A failing script fails the step
        id: failing
        continue-on-error: true
        uses: ./
        with:
          operation: exec
          run: |
            touch ~/ran-before-exit
            exit 3

      - name: It failed, and for that reason
        env:
          OUTCOME: ${{ steps.failing.outcome }}
        run: |
          [ "$OUTCOME" = failure ]
          ssh -F "$QEMU_TOOL_SSH_CONFIG" vm1 test -f ran-before-exit

      - name: down
        id: down
        if: always() && steps.fleet.outputs.stack-dir != ''
        uses: ./
        with:
          operation: down

      - name: Nothing is left running
        if: always()
        run: |
          left=$(docker ps -q --filter label=com.docker.compose.project=ci | wc -l)
          [ "$left" -eq 0 ]

      - name: Upload logs
        if: always() && steps.down.outputs.logs-dir != ''
        uses: actions/upload-artifact@v7
        with:
          name: fleet-logs
          path: ${{ steps.down.outputs.logs-dir }}
          if-no-files-found: ignore

  # A fleet XML of the caller's own, with qemu-tool pinned to a tag of
  # qemu-minimal: the two things a downstream project is most likely to set.
  boot-own:
    name: Boot a fleet of your own, from a tag
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: up
        id: fleet
        uses: ./
        with:
          qemu-tool-ref: v2.1.0
          stack-name: own
          xml: examples/fleet-minimal.xml
          xml-overlay: examples/overlay-one-guest.xml
          wait-for: rdma
          run: |
            set -x
            [ "$QT_VM_NAME" = ci-1 ]
            [ "$QT_NIC_IPS" = "$QT_RDMA_IP" ]
            ibv_devinfo -d "$QT_RDMA_DEVICE" | grep PORT_ACTIVE
            test -e /dev/kfd
            sudo nvme list | grep -c /dev/nvme

      - name: It is that fleet, on that qemu-tool
        env:
          LAYERS: ${{ steps.fleet.outputs.fleet-xml }}
          SHA: ${{ steps.fleet.outputs.qemu-tool-sha }}
          MANIFEST: ${{ steps.fleet.outputs.vm-manifest }}
        run: |
          set -eu
          [ "$(printf '%s\n' "$LAYERS" | wc -l)" = 2 ]
          printf '%s\n' "$LAYERS" | head -n1 | grep -q 'examples/fleet-minimal.xml$'
          [ "${#SHA}" = 40 ]
          echo "$MANIFEST" | python3 -c '
          import json, sys
          m = json.load(sys.stdin)
          assert len(m) == 1 and m[0]["gpu"] == "loaded" and len(m[0]["nics"]) == 1, m'
          inside=$(docker exec own-qemu-1-1 /tmp/qemu-tool-venv/bin/qemu-tool --version)
          [ "$inside" = "$(qemu-tool --version)" ]

      - name: down
        id: down
        if: always() && steps.fleet.outputs.stack-dir != ''
        uses: ./
        with:
          operation: down

      - name: Upload logs
        if: always() && steps.down.outputs.logs-dir != ''
        uses: actions/upload-artifact@v7
        with:
          name: fleet-logs-own
          path: ${{ steps.down.outputs.logs-dir }}
          if-no-files-found: ignore

  # By hand only: two four-vCPU guests on a four-core runner are
  # oversubscribed two to one, which the NIC mesh does not always survive.
  boot-two:
    name: Boot two guests (manual)
    if: github.event_name == 'workflow_dispatch' && inputs.two-guests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: up, and RDMA from the second guest to the first
        uses: ./
        with:
          vm-count: 2
          wait-for: rdma
          run: |
            [ "$QT_VM_COUNT" = 2 ]
            [ -n "$QT_PEER_RDMA_IPS" ]
            if [ "$QT_VM_INDEX" = 1 ]; then
              ib_send_bw -d "$QT_RDMA_DEVICE" --iters 200
            else
              sleep 10
              ib_send_bw -d "$QT_RDMA_DEVICE" --iters 200 "$QT_VM_1_RDMA_IP"
            fi

      - name: down
        id: down
        if: always()
        continue-on-error: true
        uses: ./
        with:
          operation: down

      - name: Upload logs
        if: always() && steps.down.outputs.logs-dir != ''
        uses: actions/upload-artifact@v7
        with:
          name: fleet-logs-two
          path: ${{ steps.down.outputs.logs-dir }}
          if-no-files-found: ignore
