name: qemu-tool
author: Stephen Bates
description: >-
  Boot QEMU guests with emulated ROCm GPUs, RDMA NICs and NVMe in a CI job,
  run commands in them, and tear them down.

branding:
  icon: cpu
  color: orange

inputs:
  operation:
    description: >-
      up (default): install qemu-tool, boot a fleet of guests, wait for them,
      optionally copy files in and run a script; the fleet is torn down when
      the job ends. install: install qemu-tool and prepare the host, nothing
      else. exec: copy files into, or run a script on, the guests an earlier
      up step booted. command: run one qemu-tool command line (args). down:
      collect logs and tear the fleet down now.
    required: false
    default: up

  # ── Installing qemu-tool ──────────────────────────────────────────────
  qemu-tool-version:
    description: >-
      What to install from PyPI: a version (2.1.0), a pip specifier
      (">=2.1,<3", the default) or "latest".
    required: false
    default: '>=2.1,<3'
  qemu-tool-source:
    description: >-
      Path to the qemu/ directory of a qemu-minimal checkout to install from
      instead of PyPI. Overrides qemu-tool-version.
    required: false
  install:
    description: Set false to use the qemu-tool already on PATH.
    required: false
    default: 'true'
  setup-host:
    description: >-
      Make /dev/kvm usable by this user and install what is missing of oras,
      qemu-utils, zstd, ansible-core, git and openssh-client. Set false on a
      runner you have prepared yourself.
    required: false
    default: 'true'
  oras-version:
    description: oras release installed when the runner has none, or one older than 1.3.4.
    required: false
    default: '1.3.4'

  # ── The fleet (operation: up) ─────────────────────────────────────────
  flavor:
    description: >-
      Shipped fleet to boot: default (rocm-golden: guests with one gfx1250
      GPU, one NVMe, one rocm-ernic RDMA NIC, one SDXI device), mi355x or
      helios.
    required: false
    default: default
  xml:
    description: >-
      Fleet XML settings files, one per line, later files overriding earlier
      ones. Replaces the flavor's own file. The inputs below are applied on
      top.
    required: false
  vm-count:
    description: Number of guests (<vm-count>). Default, the fleet's own, 2 for the default flavor.
    required: false
  vcpus:
    description: >-
      vCPUs per guest (<vm-vcpus>). Default: sized from the runner, never
      below 4, which the RDMA driver needs.
    required: false
  vmem:
    description: Guest RAM in MiB (<vm-vmem>). Default, sized from the runner.
    required: false
  fleet:
    description: >-
      Any other fleet XML elements, one `element: value` per line, e.g.
      `vm-nvme: 2` or `ernic-per-vm: 2`.
    required: false
  size-from-host:
    description: >-
      Derive guest vCPUs and RAM from the runner. Turned off by vcpus or
      vmem.
    required: false
    default: 'true'
  metrics:
    description: Also start Prometheus, Grafana and log collection.
    required: false
    default: 'false'
  clean-overlays:
    description: >-
      Start every guest from a fresh overlay of the published image rather
      than disks an earlier job left behind.
    required: false
    default: 'true'
  gpu:
    description: >-
      Make each guest's emulated GPU usable: stage the firmware of the
      rocjitsu serving it and load amdgpu with the emulation's parameters.
      Without this the GPU is on the guest's PCI bus and nothing more. Set
      false to do it yourself.
    required: false
    default: 'true'
  gpu-generation:
    description: GPU generation the firmware is generated for.
    required: false
    default: gfx1250
  wait-for:
    description: >-
      ssh (default): return once every guest answers SSH. rdma: also wait
      for each guest's RDMA device to report PORT_ACTIVE. none: return as
      soon as the stack is up.
    required: false
    default: ssh
  wait-timeout:
    description: Seconds to wait for the guests.
    required: false
    default: '900'
  in-network:
    description: >-
      Reach the guests on the stack's Docker network rather than on
      published host ports. auto (default) does so when the job itself runs
      in a container.
    required: false
    default: auto
  teardown:
    description: >-
      always (default): collect logs and tear the fleet down when the job
      ends. never: leave it running.
    required: false
    default: always
  log-lines:
    description: Lines of each container's log printed at teardown. 0 prints none; all of it is written to logs-dir either way.
    required: false
    default: '40'
  extra-args:
    description: Further flags for `qemu-tool quick-start up`.
    required: false

  # ── Where things go ───────────────────────────────────────────────────
  work-dir:
    description: >-
      Root of everything written. Default /var/lib/qemu-tool, created if
      absent, else a directory under RUNNER_TEMP.
    required: false
  stack-name:
    description: >-
      Name of the stack, which is its compose project name. Default ci. For
      exec and down, which fleet of the job is meant; default, the one the
      most recent up booted.
    required: false
  stack-dir:
    description: >-
      Where the stack is generated. Default <work-dir>/stacks/<stack-name>;
      its last component is then the stack name. Also names the fleet for
      exec and down.
    required: false
  key-dir:
    description: Where the guest image's SSH keypair is pulled to. Default <work-dir>/keys/<stack-name>.
    required: false
  images-dir:
    description: Where the guest qcow2 files go. Default <work-dir>/images. Needs about 30 GB.
    required: false

  # ── In the guests (operations up and exec) ────────────────────────────
  copy:
    description: >-
      Files or directories to copy into the guests, one `source[:destination]`
      per line. A destination is relative to the guest account's home; the
      default is `workspace` for a directory.
    required: false
  run:
    description: >-
      A bash script to run in the guests, in a login shell with `set -eo
      pipefail`. It sees QT_VM_NAME, QT_VM_INDEX, QT_VM_COUNT, QT_RDMA_IP,
      QT_RDMA_DEVICE, QT_PEER_RDMA_IPS and QT_VM_<n>_RDMA_IP. With several
      guests it runs on all of them at once.
    required: false
  fetch:
    description: >-
      Files or directories to copy out of the guests after the script, one
      `guest-path[:local-directory]` per line, whether the script passed or
      not. Each guest's copy lands in <local-directory>/<guest-name>/;
      the default directory is the fetch-dir output.
    required: false
  run-on:
    description: 'Guests copy, run and fetch apply to: all (default), first, last, or a list of guest names or indexes.'
    required: false
    default: all
  working-directory:
    description: Directory in the guest the script starts in. Default, the destination of the first directory copied, else home.
    required: false
  env:
    description: Extra environment for the script, one KEY=VALUE per line.
    required: false

  # ── operation: command ────────────────────────────────────────────────
  args:
    description: 'The qemu-tool command line, without `qemu-tool`. E.g. `gen-compose --xml fleet.xml --check`.'
    required: false

outputs:
  vm-manifest:
    description: >-
      JSON array, one object per guest: name, index, ssh_host, ssh_port,
      username, ssh_key_file, ssh_cmd, rdma_ip, rdma_ips, rdma_device, gpu.
  vm-names:
    description: The guest names, space separated.
  vm-count:
    description: How many guests are up.
  ssh-config:
    description: An ssh config file naming every guest, for `ssh -F`. Also exported as QEMU_TOOL_SSH_CONFIG.
  inventory:
    description: An Ansible inventory of the guests.
  key-file:
    description: The private key the guests accept.
  stack-dir:
    description: The generated stack. Also exported as QEMU_TOOL_STACK, so `qemu-tool compose ps` works from any step.
  stack-name:
    description: The compose project name.
  key-dir:
    description: Directory holding the keypair and the image's vm-info.json.
  images-dir:
    description: Directory holding the guest images.
  logs-dir:
    description: Where container and guest logs are written at teardown.
  fetch-dir:
    description: Where `fetch` puts what it copies out, one directory per guest.
  fleet-xml:
    description: >-
      The fleet XML layers the action passed to quick-start, one path per
      line. Empty when the flavor's shipped file is used unchanged.
  qemu-tool-version:
    description: The qemu-tool version installed.
  qemu-tool-path:
    description: Path of the qemu-tool installed.

runs:
  using: node24
  main: main.js
  post: post.js
  post-if: always()
