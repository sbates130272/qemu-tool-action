name: qemu-tool
author: Stephen Bates
description: >-
  Boot QEMU guests with emulated ROCm GPUs, RDMA NICs and NVMe in a CI job,
  run commands in them, and tear them down.

branding:
  icon: cpu
  color: orange

inputs:
  operation:
    description: >-
      up (default): install qemu-tool, boot a fleet of guests, wait for them,
      optionally copy files in and run a script; the fleet is torn down when
      the job ends. install: install qemu-tool and prepare the host, nothing
      else. exec: copy files into, or run a script on, the guests an earlier
      up step booted. command: run one qemu-tool command line (args). down:
      collect logs and tear the fleet down now.
    required: false
    default: up

  # ── Which qemu-tool ───────────────────────────────────────────────────
  # One of qemu-tool-version, qemu-tool-ref and qemu-tool-source.
  qemu-tool-version:
    description: >-
      A release of qemu-tool from PyPI: a version (2.1.0), a pip specifier
      or "latest". Default, when none of the three is given: ">=2.1,<4",
      the newest 2.x or 3.x release. qemu-tool 3 refuses ten fleet XML
      elements that 2.x read; see "From qemu-tool 2.x to 3.x" in the README.
    required: false
  qemu-tool-ref:
    description: >-
      A tag, a branch or a full commit SHA of the qemu-minimal repository
      to install qemu-tool from instead of PyPI, e.g. v2.1.0 or a SHA. Gives
      what is not released yet, and pins exactly. Not together with
      qemu-tool-version or qemu-tool-source.
    required: false
  qemu-tool-repository:
    description: The repository qemu-tool-ref is fetched from, as owner/name or a URL.
    required: false
    default: sbates130272/qemu-minimal
  qemu-tool-source:
    description: >-
      Path to the qemu/ directory of a qemu-minimal checkout already on the
      runner, to install from that. Overrides qemu-tool-version.
    required: false
  container-qemu-tool:
    description: >-
      Which qemu-tool the stack's own containers run. runner (default): the
      one installed on the runner, so the two always agree. pypi: whatever
      PyPI's latest release is, which is what qemu-tool does by itself.
    required: false
    default: runner
  install:
    description: Set false to use the qemu-tool already on PATH.
    required: false
    default: 'true'
  setup-host:
    description: >-
      Make /dev/kvm usable by this user and install what is missing of oras,
      qemu-utils, zstd, ansible-core, git and openssh-client. Set false on a
      runner you have prepared yourself.
    required: false
    default: 'true'
  oras-version:
    description: oras release installed when the runner has none, or one older than 1.3.4.
    required: false
    default: '1.3.4'

  # ── The fleet (operation: up) ─────────────────────────────────────────
  flavor:
    description: >-
      A fleet qemu-tool ships, by name. default: guests with one gfx1250
      GPU, one NVMe, one rocm-ernic RDMA NIC and one SDXI device. Others
      depend on the qemu-tool installed; `qemu-tool quick-start --help`
      lists them. Not used when xml names a fleet of your own.
    required: false
    default: default
  xml:
    description: >-
      A fleet of your own: fleet XML files, one per line, later files
      overriding earlier ones. Used in place of a shipped flavor.
    required: false
  xml-overlay:
    description: >-
      Fleet XML files layered on top of the fleet, whether that is a
      shipped flavor or your own xml: one per line, later files winning. An
      overlay names only the elements it changes.
    required: false
  vm-count:
    description: Number of guests (<vm-count>). Default, the fleet's own; 2 for the default flavor.
    required: false
  vcpus:
    description: >-
      vCPUs per guest (<vm-vcpus>). Default: the fleet's own if your XML
      sets it, else sized from the runner, never below 4, which the RDMA
      driver needs.
    required: false
  vmem:
    description: Guest RAM in MiB (<vm-vmem>). Default, as for vcpus.
    required: false
  fleet:
    description: >-
      Other fleet XML elements, one `element: value` per line, e.g.
      `vm-nvme: 2`. Applied last. Elements with structure, such as a
      <devices> block, go in a file named by xml or xml-overlay.
    required: false
  size-from-host:
    description: >-
      Derive guest vCPUs and RAM from the runner. auto (default): only when
      neither the inputs nor a fleet XML file of your own sets a size. true
      overrides sizes in your files; false leaves the fleet as written.
    required: false
    default: auto
  metrics:
    description: Also start Prometheus, Grafana and log collection.
    required: false
    default: 'false'
  clean-overlays:
    description: >-
      Start every guest from a fresh overlay of the guest image rather than
      disks an earlier job left behind.
    required: false
    default: 'true'
  gpu:
    description: >-
      Make each guest's emulated GPU usable: stage the firmware of the
      rocjitsu serving it and load amdgpu with the emulation's parameters.
      Without this the GPU is on the guest's PCI bus and nothing more.
      Guests whose image has no amdgpu-probe are left as booted. Set false
      to do it yourself. true (default): a guest with no GPU, or no
      amdgpu-probe, is not a failure; a GPU that cannot be bound is.
      required: every guest that can be brought up is, and the step then
      fails unless every guest ended with its GPU bound (status loaded),
      naming each guest that did not and its status. optional: the same
      bring-up, and nothing in it fails the step. Each
      guest's final status is in vm-manifest and the step summary.
    required: false
    default: 'true'
  gpu-generation:
    description: >-
      GPU generation the firmware is generated for. Default: read from the
      fleet's <rocjitsu-config>, else gfx1250.
    required: false
  wait-for:
    description: >-
      ssh (default): return once every guest answers SSH. rdma: also wait
      for each guest's RDMA device to report PORT_ACTIVE. none: return as
      soon as the stack is up.
    required: false
    default: ssh
  wait-timeout:
    description: >-
      Seconds to wait for the guests once the stack is up: for every guest
      to answer SSH and, with wait-for: rdma, for its RDMA port. This is
      the limit on how long the guests may take to boot.
    required: false
    default: '900'
  stack-timeout:
    description: >-
      Seconds `qemu-tool quick-start up` may take: pulling the guest image
      and the container images, and starting the stack's containers. It
      comes before wait-timeout, which does not cover it. 0 (default): no
      limit but the job's.
    required: false
    default: '0'
  ssh-aliases:
    description: >-
      Extra Host names for the guests in the ssh-config output, beside each
      guest's own name. A word containing {index} names every guest, with
      the guest's number in its place; any other word names one guest, the
      words of the first line that has one the first guest, of the next
      such line the second. Blank lines, comments and lines of {index}
      words alone are no guest's line. `guest guest{index}` gives guest and
      guest1 for the first guest and guest2 for the second. Default:
      vm{index}, which is kept as well whatever is given here, unless you
      give that very word to another guest.
    required: false
  ssh-key-file:
    description: >-
      Private key the guests accept, for a guest image that was not
      published with `qemu-tool publish-qcow` and so carries no key of its
      own to fetch. Default: the key published beside the image.
    required: false
  ssh-user:
    description: >-
      Account to log in to the guests as, with ssh-key-file. Default: the
      fleet's <vm-username>.
    required: false
  in-network:
    description: >-
      Reach the guests on the stack's Docker network rather than on
      published host ports. auto (default) does so when the job itself runs
      in a container.
    required: false
    default: auto
  teardown:
    description: >-
      always (default): collect logs and tear the fleet down when the job
      ends. never: leave it running.
    required: false
    default: always
  log-lines:
    description: Lines of each container's log printed at teardown. 0 prints none; all of it is written to logs-dir either way.
    required: false
    default: '40'
  diagnostics:
    description: >-
      Set true to also write, at teardown and whether the job passed or
      not, a diagnostics directory under logs-dir: for each guest its whole
      dmesg, `lspci -nnk`, lsblk, lsmod and the parameters of the GPU, NIC,
      NVMe and SDXI kernel modules, and the stack's resolved compose
      configuration. Values in that file are redacted by name: those of
      keys, variables and flags named like a credential (password, secret,
      token, api-key, *_KEY, *_PASS, *_AUTH and the like). A secret under
      any other name, in a docker-compose.override.yml of yours or passed
      through from the runner's environment, is written as it is, so read
      the file before uploading it. Best effort: a guest that does not
      answer is noted and skipped. Default false. On operation: down, the
      default is what the up step was given.
    required: false
  extra-args:
    description: >-
      Further flags for `qemu-tool quick-start up`. A relative path given
      to one of its file or directory flags is taken against the workspace.
    required: false

  # ── Where things go ───────────────────────────────────────────────────
  work-dir:
    description: >-
      Root of everything written. Default /var/lib/qemu-tool, created if
      absent, else a directory under RUNNER_TEMP.
    required: false
  stack-name:
    description: >-
      Name of the stack, which is its compose project name. Default ci. For
      exec and down, which fleet of the job is meant; default, the one the
      most recent up booted.
    required: false
  stack-dir:
    description: >-
      Where the stack is generated. Default <work-dir>/stacks/<stack-name>;
      its last component is then the stack name. Also names the fleet for
      exec and down.
    required: false
  key-dir:
    description: Where the guests' SSH key is kept. Default <work-dir>/keys/<stack-name>.
    required: false
  images-dir:
    description: Where the guest qcow2 files go. Default <work-dir>/images. The default fleet needs about 30 GB.
    required: false

  # ── In the guests (operations up and exec) ────────────────────────────
  copy:
    description: >-
      Files or directories to copy into the guests, one `source[:destination]`
      per line. A destination is relative to the guest account's home; the
      default is `workspace` for a directory.
    required: false
  run:
    description: >-
      A bash script to run in the guests, in a login shell with `set -eo
      pipefail`. It sees QT_VM_NAME, QT_VM_INDEX, QT_VM_COUNT, QT_RDMA_IP,
      QT_RDMA_DEVICE, QT_NIC_IPS, QT_PEER_RDMA_IPS and QT_VM_<n>_RDMA_IP.
      With several guests it runs on all of them at once.
    required: false
  fetch:
    description: >-
      Files or directories to copy out of the guests after the script, one
      `guest-path[:local-directory]` per line, whether the script passed or
      not. Each guest's copy lands in <local-directory>/<guest-name>/;
      the default directory is the fetch-dir output.
    required: false
  run-on:
    description: 'Guests copy, run and fetch apply to: all (default), first, last, or a list of guest names or indexes.'
    required: false
    default: all
  working-directory:
    description: Directory in the guest the script starts in. Default, the destination of the first directory copied, else home.
    required: false
  env:
    description: Extra environment for the script, one KEY=VALUE per line.
    required: false

  # ── operation: command ────────────────────────────────────────────────
  args:
    description: 'The qemu-tool command line, without `qemu-tool`. E.g. `gen-compose --xml fleet.xml --output-dir out`.'
    required: false

outputs:
  vm-manifest:
    description: >-
      JSON array, one object per guest: name, index, ssh_host, ssh_port,
      username, ssh_key_file, ssh_cmd, ssh_aliases, rdma_ip, rdma_ips,
      nics, rdma_device, gpu.
  vm-names:
    description: The guest names, space separated.
  vm-count:
    description: How many guests are up.
  ssh-config:
    description: An ssh config file naming every guest, for `ssh -F`. Also exported as QEMU_TOOL_SSH_CONFIG.
  inventory:
    description: An Ansible inventory of the guests.
  key-file:
    description: The private key the guests accept.
  stack-dir:
    description: The generated stack. Also exported as QEMU_TOOL_STACK, so `qemu-tool compose ps` works from any step.
  stack-name:
    description: The compose project name.
  key-dir:
    description: Directory holding the key and the image's vm-info.json.
  images-dir:
    description: Directory holding the guest images.
  logs-dir:
    description: Where container and guest logs are written at teardown.
  fetch-dir:
    description: Where `fetch` puts what it copies out, one directory per guest.
  fleet-xml:
    description: >-
      The fleet XML layers the fleet was booted from, lowest first, one
      path per line: the shipped flavor's file or your own, then the
      overlays.
  qemu-tool-version:
    description: The qemu-tool version installed, as it reports itself.
  qemu-tool-path:
    description: Path of the qemu-tool installed.
  qemu-tool-sha:
    description: With qemu-tool-ref, the commit it resolved to. Empty otherwise.
  qemu-tool-checkout:
    description: With qemu-tool-ref, the qemu-minimal checkout that was fetched. Empty otherwise.

runs:
  using: node24
  main: main.js
  post: post.js
  post-if: always()
